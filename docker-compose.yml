version: '3.8'

services:
  nife-llmlite:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nife-llmlite-api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - VERBOSE=false
      - DEBUG=false
    restart: unless-stopped
    networks:
      - llmlite-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  llmlite-network:
    driver: bridge
